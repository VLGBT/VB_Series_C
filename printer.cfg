
# ==============================================================================
# ФАЙЛ: printer.cfg — главный конфигурационный файл принтера
# Назначение: Точка входа Klipper. Подключает базовые секции через [include],
# содержит калибровочные значения, уникальные для этого экземпляра машины
# (serial MCU, PID нагревателей, z_offset пробы, input_shaper), и хранит
# автогенерируемый системный блок SAVE_CONFIG в конце файла.
#
# ПОРЯДОК РАБОТЫ С КАЛИБРОВКОЙ:
#   1) Задайте control: pid у нужного нагревателя (как в шаблонах ниже).
#   2) Запустите калибровку — макрос сам выполнит PID_CALIBRATE и SAVE_CONFIG.
#   3) SAVE_CONFIG автоматически: закомментирует ручные строки pid_* в этой
#      секции, запишет рассчитанные значения в системный блок в конце файла
#      и перезагрузит Klipper. Вручную ничего править не нужно.
# ==============================================================================


# ------------------------------------------------------------------------------
# Выбор профиля принтера (раскомментировать нужный)
# ------------------------------------------------------------------------------
#[include printers/A4C.cfg]                                    # Профиль машины A4C
#[include printers/A3C.cfg]                                    # Профиль машины A3C


# ------------------------------------------------------------------------------
# Резервный нагреватель стола (шаблон, отключён)
# ------------------------------------------------------------------------------
#[heater_generic heater_bed1]
#control: pid                                                  # Тип регулятора: PID
#pid_kp: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
#pid_ki: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
#pid_kd: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)


# ==============================================================================
# СЕКЦИЯ: mcu
# Назначение: Подключение основной платы. Serial уникален для каждой платы —
# получить командой: ls /dev/serial/by-id/*
# ==============================================================================
[mcu]
serial: /dev/serial/by-id/****                                 # ЗАПОЛНИТЬ: путь к своей плате


# ==============================================================================
# СЕКЦИЯ: extruder (калибровка PID)
# Калибровка: PID_CALIBRATE HEATER=extruder TARGET=<рабочая температура>.
# SAVE_CONFIG сам закомментирует строки pid_* ниже и запишет результат
# в системный блок. Вручную трогать не нужно.
# ==============================================================================
[extruder]
control: pid                                                  # Тип регулятора: PID
pid_kp: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
pid_ki: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
pid_kd: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)


# ==============================================================================
# СЕКЦИЯ: probe (калибровка z_offset)
# Калибровка: PROBE_CALIBRATE → TESTZ → ACCEPT → SAVE_CONFIG.
# SAVE_CONFIG сам закомментирует строку ниже и запишет результат
# в системный блок. Для Voron Tap типично около 0.
# ==============================================================================
[probe]
z_offset: 0                                                   # Стартовое значение (перезапишет SAVE_CONFIG)


# ==============================================================================
# СЕКЦИЯ: chamber (калибровка PID)
# Калибровка: PID_CALIBRATE HEATER=chamber TARGET=<рабочая температура>.
# SAVE_CONFIG сам закомментирует строки pid_* ниже и запишет результат
# в системный блок. Вручную трогать не нужно.
# ==============================================================================
[heater_generic chamber]
control: pid                                                  # Тип регулятора: PID
pid_kp: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
pid_ki: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
pid_kd: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)


# ==============================================================================
# СЕКЦИЯ: heater_bed (калибровка PID)
# Калибровка: PID_CALIBRATE HEATER=heater_bed TARGET=<рабочая температура>.
# SAVE_CONFIG сам закомментирует строки pid_* ниже и запишет результат
# в системный блок. Вручную трогать не нужно.
# ==============================================================================
[heater_generic heater_bed]
control: pid                                                  # Тип регулятора: PID
pid_kp: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
pid_ki: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)
pid_kd: 100                                                   # Стартовое значение (перезапишет SAVE_CONFIG)


# ==============================================================================
# СЕКЦИЯ: input_shaper
# Калибровка: SHAPER_CALIBRATE (нужен акселерометр) → SAVE_CONFIG.
# SAVE_CONFIG сам запишет параметры shaper_* в системный блок.
# ==============================================================================
[input_shaper]


# ==============================================================================
# #############################################################################
# ##                                                                         ##
# ##   ВНИМАНИЕ: НИЖЕ — СИСТЕМНАЯ ОБЛАСТЬ SAVE_CONFIG                         ##
# ##                                                                         ##
# ##   Всё, что расположено после строки-разделителя ниже, Klipper           ##
# ##   генерирует и перезаписывает АВТОМАТИЧЕСКИ при выполнении SAVE_CONFIG   ##
# ##   (после PID_CALIBRATE, PROBE_CALIBRATE, SHAPER_CALIBRATE, BED_MESH и    ##
# ##   т.п.). РУКАМИ НИЧЕГО НЕ ПРАВИТЬ. Klipper сам комментирует конфликтующие ##
# ##   опции выше и держит актуальные значения здесь.                         ##
# ##                                                                         ##
# #############################################################################
# ==============================================================================