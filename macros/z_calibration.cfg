# ==============================================================================
# МАКРОС: _PREPARE_PROBE
# Назначение: Преодолевает сопротивление магнита перед точными замерами. Делает
# одиночное касание щупом и откатывает стол на 2 мм, чтобы гарантированно сорвать
# каретку с магнита. Вызывается перед PROBE/PROBE_CALIBRATE.
# ==============================================================================
[gcode_macro _PREPARE_PROBE]
description: Срыв магнита перед точными замерами щупа
gcode:
  RESPOND MSG="Подготовка к калибровке: преодоление сопротивления магнита..."                                 # Сообщаем о старте подготовки щупа
  G90                                                                                                         # Абсолютное позиционирование
  G1 Z10 F1200                                                                                                # Поднимаем стол на 10 мм (безопасный зазор перед пробой)
  PROBE SAMPLES=1                                                                                             # Одиночное касание щупом (предварительное)
  SAVE_GCODE_STATE NAME=_ui_movement                                                                          # Сохраняем состояние перед ручным откатом
  G91                                                                                                         # Относительные координаты
  G1 Z2                                                                                                       # Откат стола на 2 мм вниз (срыв каретки с магнита)
  RESTORE_GCODE_STATE NAME=_ui_movement                                                                       # Возвращаем сохранённое состояние
  G90                                                                                                         # Абсолютные координаты
  RESPOND MSG="Подготовка завершена. Стол готов к точным замерам."                                            # Сообщаем о завершении подготовки


# ==============================================================================
# МАКРОС: _PROBE_CALIBRATE
# Назначение: Ручная калибровка Z-offset бумажкой. Хоумит оси при необходимости,
# едет в центр стола, срывает магнит и запускает штатный PROBE_CALIBRATE для
# пошаговой подстройки через TESTZ.
# ==============================================================================
[gcode_macro _PROBE_CALIBRATE]
description: Ручная калибровка Z-offset бумажкой
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}                                                           # Если оси ещё не запаркованы
    G28                                                                                                       # Хоуминг всех осей
  {% endif %}                                                                                                 # Конец проверки хоуминга
  G90                                                                                                         # Абсолютное позиционирование
  G1 Z5 F1200                                                                                                 # Поднимаем стол для безопасного переезда

  # --- Едем в центр стола (с учётом смещения щупа) ---
  {% set probe_x = printer.toolhead.axis_maximum.x / 2 - printer.configfile.config.probe.x_offset | float %}  # Центр стола по X с учётом смещения щупа
  {% set probe_y = printer.toolhead.axis_maximum.y / 2 - printer.configfile.config.probe.y_offset | float %}  # Центр стола по Y с учётом смещения щупа
  G1 X{probe_x} Y{probe_y} F6000                                                                              # Едем в центр стола

  # --- Срываем магнит перед ручной калибровкой ---
  _PREPARE_PROBE                                                                                              # Преодолеваем сопротивление магнита

  # --- Запуск стандартной калибровки бумажкой ---
  PROBE_CALIBRATE                                                                                             # Штатная пошаговая калибровка Z-offset
  RESPOND MSG="Ручная калибровка начата. Магнит преодолен. Используйте TESTZ."                                # Подсказываем пользователю следующий шаг


# ==============================================================================
# МАКРОС: _CALIBRATE_Z_HEIGHT
# Назначение: Автоматическая калибровка высоты Z щупом. Едет в центр стола,
# срывает магнит, делает точное касание, пересчитывает Z по результату пробы и
# паркует голову. Вызывается из _START_PRINT.
# ==============================================================================
[gcode_macro _CALIBRATE_Z_HEIGHT]
description: Автокалибровка высоты Z щупом
gcode:
  G90                                                                                                         # Абсолютное позиционирование
  G1 Z20 F1200                                                                                                # Поднимаем стол на 20 мм (безопасный зазор)

  # --- Центр стола и скорость переезда ---
  {% set probe_x = printer.toolhead.axis_maximum.x / 2 - printer.configfile.config.probe.x_offset | float %}  # Центр стола по X с учётом смещения щупа
  {% set probe_y = printer.toolhead.axis_maximum.y / 2 - printer.configfile.config.probe.y_offset | float %}  # Центр стола по Y с учётом смещения щупа
  {% set speed = printer.toolhead.max_velocity * 60 / 2 %}                                                    # Скорость переезда = половина макс. скорости

  G1 X{probe_x} Y{probe_y} F{speed}                                                                           # Едем в центр стола на скорости переезда
  _PREPARE_PROBE                                                                                              # Срываем магнит перед точным замером
  PROBE                                                                                                       # Точное касание щупом
  _ADJUST_Z_HEIGHT                                                                                            # Пересчитываем Z по результату пробы
  G1 Z5 F1200                                                                                                 # Поднимаем стол после замера
                                                                                           # Паркуем голову


# ==============================================================================
# МАКРОС: _ADJUST_Z_HEIGHT
# Назначение: Пересчитывает систему координат Z по результату последней пробы.
# Сдвигает текущий Z на разницу между измеренным касанием и настроенным
# z_offset щупа. Вызывается из _CALIBRATE_Z_HEIGHT сразу после PROBE.
# ==============================================================================
[gcode_macro _ADJUST_Z_HEIGHT]
description: Коррекция координаты Z по результату пробы
gcode:
  {% set position_z = printer.toolhead.position.z|float|round(3) %}                                           # Текущая позиция Z (округлённая)
  {% set last_z_result = printer.probe.last_z_result|float|round(3) %}                                        # Результат последней пробы (округлённый)
  {% set z_offset = printer.configfile.settings.probe.z_offset|float|round(3) %}                              # Настроенный Z-offset щупа из конфига

  G92 Z{ position_z - (last_z_result - z_offset) |round(2) }                                                  # Сдвигаем систему координат Z на поправку