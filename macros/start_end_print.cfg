# ==============================================================================
# МАКРОС: _START_PRINT
# Назначение: Стартовая последовательность печати. Проверяет наличие филамента,
# выполняет хоуминг, прогрев камеры/стола, преднагрев сопла до 70% для снятия
# наплыва, калибровку Z и сетки стола, догрев сопла до 100% и адаптивную
# продувку. Вызывается из стартового G-кода слайсера.
# ==============================================================================
[gcode_macro _START_PRINT]
description:
  EXTRUDER_TEMP - температура экструдера
  BED_TEMP - температура стола
  CHAMBER_TEMP - температура термокамеры
  Стартовый G-code:
  PrusaSlicer: _START_PRINT EXTRUDER_TEMP={first_layer_temperature[initial_extruder]} BED_TEMP={first_layer_bed_temperature[initial_extruder]} CHAMBER_TEMP={chamber_temperature[0]} PRINT_MIN_X={first_layer_print_min[0]} PRINT_MIN_Y={first_layer_print_min[1]} PRINT_MAX_X={first_layer_print_max[0]} PRINT_MAX_Y={first_layer_print_max[1]}

  OrcaSlicer: _START_PRINT EXTRUDER_TEMP={nozzle_temperature_initial_layer[0]} BED_TEMP={bed_temperature_initial_layer_single} CHAMBER_TEMP={chamber_temperature[0]} PRINT_MIN_X={first_layer_print_min[0]} PRINT_MIN_Y={first_layer_print_min[1]} PRINT_MAX_X={first_layer_print_max[0]} PRINT_MAX_Y={first_layer_print_max[1]}
gcode:
  SET_IDLE_TIMEOUT TIMEOUT=86400                                                 # Таймаут простоя на сутки (прогрев/калибровка не выключат моторы)

  # --- Параметры температур из слайсера ---
  {% set extruder_temp = params.EXTRUDER_TEMP | float %}                         # Целевая температура экструдера
  {% set bed_temp = params.BED_TEMP | float %}                                   # Целевая температура стола
  {% set chamber_temp = params.CHAMBER_TEMP | default(0) | float %}              # Целевая температура камеры (0 = не греть)
  {% set preheat_temp = (extruder_temp * 0.7) | round(0) %}                      # Преднагрев сопла = 70% от номинала (снятие наплыва без течи)

  # --- Границы детали для адаптивной продувки (передаёт слайсер) ---
  {% set p_min_x = params.PRINT_MIN_X | default(10) | float %}                   # Левая граница детали по X
  {% set p_min_y = params.PRINT_MIN_Y | default(10) | float %}                   # Передняя граница детали по Y
  {% set p_max_x = params.PRINT_MAX_X | default(190) | float %}                  # Правая граница детали по X
  {% set p_max_y = params.PRINT_MAX_Y | default(190) | float %}                  # Задняя граница детали по Y

  # --- Проверка наличия филамента ---
  {% if printer['filament_switch_sensor 0'] is defined %}                        # Если датчик наличия объявлен в конфиге
    {% set fil_det = printer['filament_switch_sensor 0'].filament_detected %}    # Читаем его состояние (True = филамент есть)
  {% else %}                                                                     # Если датчика в конфиге нет
    {% set fil_det = True %}                                                     # Считаем, что филамент есть, чтобы не блокировать печать
  {% endif %}                                                                    # Конец проверки наличия датчика

  {% if fil_det %}                                                               # Если филамент обнаружен — запускаем печать
    G28                                                                          # Хоуминг всех осей (Z паркуется вниз, стол отведён)

    # --- Прогрев камеры (если задана) ---
    {% if chamber_temp > 0 %}                                                    # Если слайсер передал температуру камеры > 0
      M191 S{chamber_temp}                                                       # Греем камеру с ожиданием выхода на температуру
    {% endif %}                                                                  # Конец блока прогрева камеры

    # --- Прогрев стола ---
    M190 S{bed_temp}                                                             # Греем стол с ожиданием выхода на температуру

    # --- Преднагрев сопла до 70% для снятия наплыва перед пробой ---
    M109 S{preheat_temp}                                                         # Греем сопло до 70% и ждём (наплыв размягчён, но не течёт)

    # --- Калибровка высоты Z (проба Tap по касанию соплом) ---
    _CALIBRATE_Z_HEIGHT                                                          # Определяем Z-оффсет щупом (наплыв снимается в _PARK)

    # --- Адаптивная калибровка сетки стола ---
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=10                             # Строим сетку под областью детали + 10 мм запаса

    # --- Догрев сопла до рабочей температуры ---
    M109 S{extruder_temp}                                                        # Догреваем хотэнд до 100% и ждём печатную температуру

    # --- Адаптивная продувка сопла ---
    _PURGE_LINE MIN_X={p_min_x} MIN_Y={p_min_y} MAX_X={p_max_x} MAX_Y={p_max_y}  # Рисуем линию продувки рядом с деталью
    RESPOND MSG="Старт печати"                                                   # Сообщаем в консоль о начале печати

  {% else %}                                                                     # Если филамент НЕ обнаружен
    RESPOND TYPE=error MSG="Отсутствует филамент!"                               # Выводим ошибку в консоль
    CANCEL_PRINT                                                                 # Отменяем печать
  {% endif %}                                                                    # Конец главной проверки филамента
  
# ==============================================================================
# МАКРОС: _END_PRINT
# Назначение: Завершающая последовательность печати. Вызывает _SAFE_PARK для
# парковки головы (с безопасным подъёмом Z), опускает стол максимально вниз
# для снятия детали, гасит нагреватели, обдув и моторы.
# ==============================================================================
[gcode_macro _END_PRINT]
description: Завершение печати с парковкой и отключением нагрева
gcode:
  G92 E0                                                                       # Обнуляем позицию экструдера
  G90                                                                          # Абсолютное позиционирование

  # --- Парковка головы (существующий макрос: подъём Z + отвод в угол) ---
  _SAFE_PARK                                                                   # Безопасная парковка головы

  # --- Опускание стола максимально вниз для снятия детали ---
  _BED_TO_BOTTOM                                                                # Стол в самый низ (с учётом Z-offset)

  # --- Выключение нагревателей ---
  TURN_OFF_HEATERS                                                             # Гасим все нагреватели (экструдер, стол, камера)

  M107                                                                         # Выключаем обдув детали (кастомный макрос)
  M84                                                                          # Отключаем шаговые двигатели
  RESPOND MSG="Печать завершена!"                                             # Сообщаем в консоль о завершении
  SET_IDLE_TIMEOUT TIMEOUT=600                                                 # Возвращаем таймаут простоя к 600 с (10 мин)

# ==============================================================================
# МАКРОС: POST_COOLING_CYCLE
# Назначение: Программный отжиг (плавное остывание) детали. Медленно снижает
# температуру камеры шагами, чтобы деталь не растрескалась. Поддерживает и
# обратный режим (плавный нагрев) при START < END.
# ==============================================================================
[gcode_macro POST_COOLING_CYCLE]
description:
  Макрос цикла пост-остывания
  DPH - на сколько охлаждать за 1 час
  STEP - шаг охлаждения
  START - начальное значение
  END - конечное значение
  Пример использования: POST_COOLING_CYCLE START=180 END=50
gcode:
  {% set DPH = params.DPH | default(60) | int %}                                                              # Скорость изменения температуры (градусов в час)
  {% set STEP = params.STEP | default(-2) | int %}                                                            # Шаг изменения температуры за итерацию
  {% set START = params.START | default(75) | int %}                                                          # Начальная температура цикла
  {% set END = params.END | default(30) | int %}                                                              # Конечная температура цикла

  # --- Безопасная подготовка перед долгим циклом ---
  _SAFE_PARK                                                                                                  # Паркуем голову (подъём Z + отвод в угол)
  _BED_TO_BOTTOM                                                                                              # Стол в самый низ (с учётом Z-offset)
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0                                                             # Гасим хотэнд
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0                                                           # Гасим стол
  M107                                                                                                        # Выключаем обдув детали

  # --- Валидация параметров (направление шага должно совпадать с направлением цикла) ---
  {% if START < END and STEP < 0 %}                                                                           # Нагрев запрошен, но шаг отрицательный
    { action_respond_info("Ошибка: STEP( %s ) должен быть %s " % (STEP, STEP|abs)) }                          # Подсказываем правильный знак шага
  {% elif START > END and STEP > 0 %}                                                                         # Остывание запрошено, но шаг положительный
    { action_respond_info("Ошибка: STEP( %s ) должен быть %s " % (STEP, -STEP)) }                             # Подсказываем правильный знак шага
  {% elif START == END %}                                                                                     # Начало и конец совпадают — цикла нет
    { action_respond_info("Ошибка: START( %s ) не может быть равен END( %s )" % (START, END)) }               # Сообщаем об ошибке
  {% elif STEP == 0 or DPH <= 0 %}                                                                            # Нулевой шаг или неположительная скорость
    { action_respond_info("Ошибка: STEP( %s ) или DPH( %s ) не может быть 0 " % (STEP, DPH)) }                # Сообщаем об ошибке

  {% else %}                                                                                                  # Параметры корректны — выполняем цикл
    {% set dwell_ms = (3600 / DPH * (STEP|abs) * 1000) | int %}                                               # Длительность выдержки на каждом шаге, мс

    {% if START > END %}                                                                                      # --- РЕЖИМ ОСТЫВАНИЯ ---
      RESPOND TYPE=echo MSG="Цикл охлаждения до {END}°C запущен! Шаг {STEP}°C, скорость {DPH}°C/час"        # Сообщаем параметры цикла
      {% for temp in range(START, END, STEP) %}                                                               # Идём от START к END с шагом STEP
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={temp}                                                   # Задаём промежуточную температуру камеры
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MAXIMUM={temp}                                       # Ждём, пока камера остынет до цели
        G4 P{dwell_ms}                                                                                        # Выдержка на текущем шаге
      {% endfor %}                                                                                            # Конец цикла остывания
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET={END}                                                      # Задаём конечную температуру
      TEMPERATURE_WAIT SENSOR="heater_generic chamber" MAXIMUM={END}                                          # Ждём выхода на конечную температуру

    {% else %}                                                                                                # --- РЕЖИМ НАГРЕВА ---
      RESPOND TYPE=echo MSG="Цикл нагрева до {END}°C запущен! Шаг {STEP}°C, скорость {DPH}°C/час"           # Сообщаем параметры цикла
      {% for temp in range(START, END, STEP) %}                                                               # Идём от START к END с положительным шагом
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={temp}                                                   # Задаём промежуточную температуру камеры
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={temp}                                       # Ждём, пока камера нагреется до цели
        G4 P{dwell_ms}                                                                                        # Выдержка на текущем шаге
      {% endfor %}                                                                                            # Конец цикла нагрева
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET={END}                                                      # Задаём конечную температуру
      TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={END}                                          # Ждём выхода на конечную температуру
    {% endif %}                                                                                               # Конец выбора режима

    RESPOND TYPE=echo MSG="Цикл завершен!"                                                                    # Сообщаем о завершении цикла
  {% endif %}                                                                                                 # Конец валидации параметров


# ==============================================================================
# МАКРОС: _PURGE_LINE
# Назначение: Продувка сопла зигзагом из двух полосок вдоль оси Y слева от
# детали. После продувки сопло поднимается и паркуется в правом заднем углу
# границы модели (max_x, max_y). Вызывается из _START_PRINT перед печатью.
# ==============================================================================
[gcode_macro _PURGE_LINE]
description: Линия продувки слева от детали с парковкой в угол модели
gcode:
    {% set min_x = params.MIN_X | default(0) | float %}                          # Левая граница детали по X
    {% set min_y = params.MIN_Y | default(0) | float %}                          # Передняя граница детали по Y
    {% set max_x = params.MAX_X | default(420) | float %}                        # Правая граница детали по X
    {% set max_y = params.MAX_Y | default(300) | float %}                        # Задняя граница детали по Y
    {% set nozzle = params.NOZZLE | default(0.4) | float %}                      # Диаметр сопла, мм

    {% set step = nozzle + 0.1 %}                                                # Шаг между полосками = диаметр сопла + 0.1 мм
    {% set stripe_len = 40 %}                                                    # Длина одной полоски по Y, мм
    {% set total_e = 30 %}                                                       # Суммарная длина выдавливаемого филамента, мм
    {% set e_per = total_e / 2 %}                                                # Выдавка на одну полоску (всего 2 полоски)

    # --- Линия продувки всегда слева от детали ---
    {% set purge_x = min_x - 5 %}                                                # Линия продувки на 5 мм левее детали

    G90                                                                          # Абсолютное позиционирование
    G1 Z5 F1200                                                                  # Поднимаем сопло для безопасного переезда
    G1 X{purge_x} Y{min_y} F6000                                                 # Едем к начальной точке линии продувки
    G1 Z0.2 F300                                                                 # Опускаемся на высоту печати 0.2 мм
    M83                                                                          # Относительный режим экструдера

    G1 Y{min_y + stripe_len} E{e_per} F300                                       # Полоска 1: вверх по Y с выдавливанием
    G1 X{purge_x + step}                                                         # Сдвиг по X на один шаг
    G1 Y{min_y} E{e_per} F300                                                    # Полоска 2: вниз по Y с выдавливанием

    G1 E-1 F2100                                                                 # Ретракт 1 мм, чтобы нить не тянулась
    G1 Z5 F1200                                                                  # Поднимаем сопло на безопасную высоту
    G1 X{max_x} Y{max_y} F6000                                                   # Паркуем сопло в правый задний угол границы детали
    M82                                                                          # Возвращаем абсолютный режим экструдера                                                                                                   # Возвращаем абсолютный режим экструдера


# ==============================================================================
# МАКРОС: _PURGE_POINT
# Назначение: Продувка сопла в точке за пределами стола (по position_min X/Y).
# Выдавливает клубок пластика вне рабочей зоны и делает ретракт. Используется
# для сброса пластика там, где он не мешает печати.
# ==============================================================================
[gcode_macro _PURGE_POINT]
description: Продувка сопла за пределами стола (X min, Y min)
gcode:
  # --- Читаем координаты сброса из position_min осей ---
  {% set target_x = printer.configfile.config['stepper_x'].position_min | default(0) | float %}               # X-координата зоны сброса
  {% set target_y = printer.configfile.config['stepper_y'].position_min | default(0) | float %}               # Y-координата зоны сброса

  G90                                                                                                         # Абсолютное позиционирование
  G1 Z5 F1200                                                                                                 # Поднимаем сопло на 5 мм для безопасного переезда

  G1 X{target_x} Y{target_y} F6000                                                                            # Едем в зону сброса пластика за пределами стола

  # ВАЖНО: если сопло упирается в раму за пределами стола — увеличьте Z0.2 (например Z1/Z2)
  G1 Z0.2 F300                                                                                                # Опускаемся на минимальную высоту для сброса

  M83                                                                                                         # Относительный режим экструдера

  G1 E20 F100                                                                                                 # Выдавливаем 20 мм филамента (клубок падает вниз)

  G1 E-2 F2100                                                                                                # Ретракт 2 мм, чтобы нить не тянулась

  G1 Z7 F1200                                                                                                 # Поднимаем сопло на безопасную высоту (7 мм)
  M82                                                                                                         # Возвращаем абсолютный режим экструдера