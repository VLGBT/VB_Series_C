
# ==============================================================================
# МАКРОС: LOAD_FILAMENT
# Назначение: Подача (загрузка) филамента в хотэнд. Перед подачей проверяет,
# что сопло прогрето до min_extrude_temp — на холодную выдаёт ошибку. Расстояние
# подачи задаётся переменной load_distance, скорость — параметром SPEED.
# ==============================================================================
[gcode_macro LOAD_FILAMENT]
variable_load_distance: 100                                                       # Расстояние подачи филамента, мм
gcode:
  {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}     # Минимальная температура экструзии из конфига
  {% if printer.extruder.temperature < min_temp %}                               # Если сопло холоднее порога экструзии
    RESPOND TYPE=error MSG="Сопло холодное — прогрейте перед подачей филамента"  # Блокируем подачу и сообщаем об ошибке
  {% else %}                                                                     # Сопло достаточно прогрето
    {% set speed = params.SPEED|default(450) %}                                  # Скорость подачи из параметра SPEED (по умолч. 450 мм/мин)
    {% set distance = printer["gcode_macro LOAD_FILAMENT"].load_distance %}      # Читаем расстояние подачи из переменной макроса
    SAVE_GCODE_STATE NAME=load_state                                             # Сохраняем текущее состояние (режим экструдера)
    G91                                                                          # Относительные координаты
    G92 E0                                                                       # Обнуляем позицию экструдера
    G1 E{distance} F{speed}                                                      # Выдавливаем филамент на distance мм со скоростью speed
    RESTORE_GCODE_STATE NAME=load_state                                          # Возвращаем сохранённое состояние
  {% endif %}                                                                    # Конец проверки температуры


# ==============================================================================
# МАКРОС: UNLOAD_FILAMENT
# Назначение: Извлечение (выгрузка) филамента из хотэнда. Перед откатом проверяет
# прогрев сопла до min_extrude_temp — на холодную выдаёт ошибку. Расстояние
# отката задаётся переменной unload_distance, скорость — параметром SPEED.
# ==============================================================================
[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 100                                                     # Расстояние отката филамента, мм
gcode:
  {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}     # Минимальная температура экструзии из конфига
  {% if printer.extruder.temperature < min_temp %}                               # Если сопло холоднее порога экструзии
    RESPOND TYPE=error MSG="Сопло холодное — прогрейте перед подачей филамента"  # Блокируем откат и сообщаем об ошибке
  {% else %}                                                                     # Сопло достаточно прогрето
    {% set speed = params.SPEED|default(250) %}                                  # Скорость отката из параметра SPEED (по умолч. 250 мм/мин)
    {% set distance = printer["gcode_macro UNLOAD_FILAMENT"].unload_distance %}  # Читаем расстояние отката из переменной макроса
    SAVE_GCODE_STATE NAME=unload_state                                           # Сохраняем текущее состояние (режим экструдера)
    G91                                                                          # Относительные координаты
    G92 E0                                                                       # Обнуляем позицию экструдера
    G1 E-{distance} F{speed}                                                     # Откатываем филамент на distance мм (минус = реверс)
    RESTORE_GCODE_STATE NAME=unload_state                                        # Возвращаем сохранённое состояние
  {% endif %}                                                                    # Конец проверки температуры