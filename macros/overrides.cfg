# ==============================================================================
# МАКРОС: SET_HEATER_TEMPERATURE
# Назначение: Переопределяет штатную установку температуры. Проверяет верхние
# лимиты нагревателей и защищает стол от температурного шока — не даёт греть
# стол выше порога, пока не прогрета камера. При задании температуры ЛЮБОЙ
# зоне стола из bed_zones цель получают ВСЕ зоны из списка, реально
# существующие в конфиге. При печати нарушение лимита отменяет печать.
# ==============================================================================
[gcode_macro SET_HEATER_TEMPERATURE]                                        # Переопределяем штатную команду макросом
rename_existing: SET_HEATER_TEMPERATURE_BASE                                # Штатную команду прячем в SET_HEATER_TEMPERATURE_BASE
description: Нагрев с лимитами и синхронизацией зон стола                   # Описание для интерфейса

# --- Зоны стола (перечисли ВСЕ возможные; отсутствующие пропускаются) ---
variable_bed_zones: ["heater_bed", "heater_bed1"]                           # Короткие имена зон стола

# --- Лимиты нагревателей (правь под своё железо) ---
variable_extruder_limit: 500                                                # Максимум для экструдера
variable_bed_limit: 200                                                     # Максимум для стола (все зоны)
variable_chamber_limit: 200                                                 # Максимум для термокамеры

# --- Пороги защиты стола от температурного шока ---
variable_bed_high_temp: 160                                                 # Выше этой температуры стола нужна прогретая камера
variable_chamber_required: 100                                              # Камера должна быть прогрета не ниже этого значения
gcode:                                                                      # Начало тела макроса
  {% set HEATER = params.HEATER|string %}                                   # Имя нагревателя
  {% set TARGET = params.TARGET|float %}                                    # Целевая температура
  {% set cfg = printer["gcode_macro SET_HEATER_TEMPERATURE"] %}             # Ссылка на переменные этого макроса
  {% set printing = printer.print_stats.state == "printing" %}              # True, если сейчас идёт печать

  # --- Какие нагреватели реально есть в конфиге ---
  {% set found = [] %}                                                      # Список коротких имён нагревателей
  {% for h in printer.heaters.available_heaters %}                          # Перебираем все нагреватели Klipper
    {% set _ = found.append(h.split(" ")[-1]) %}                            # Запоминаем короткое имя (без heater_generic)
  {% endfor %}                                                              # Конец перебора нагревателей
  {% set is_bed = HEATER in cfg.bed_zones %}                                # True, если задана любая зона стола

  # --- Выбираем лимит для нагревателя ---
  {% if is_bed %}                                                           # Если это зона стола
    {% set limit = cfg.bed_limit|float %}                                   # Лимит стола (общий для всех зон)
  {% elif HEATER == "extruder" %}                                           # Если это экструдер
    {% set limit = cfg.extruder_limit|float %}                              # Лимит экструдера
  {% elif HEATER == "chamber" %}                                            # Если это термокамера
    {% set limit = cfg.chamber_limit|float %}                               # Лимит термокамеры
  {% else %}                                                                # Неизвестный нагреватель
    {% set limit = TARGET %}                                                # Не ограничиваем
  {% endif %}                                                               # Конец выбора лимита

  # --- Проверка верхнего предела (0 всегда разрешён — это выключение) ---
  {% if TARGET > limit and TARGET != 0 %}                                   # Если цель выше лимита и это не выключение
    {% set msg = "Невозможно установить " ~ TARGET ~ "° для "               # Текст ошибки, часть 1...
      ~ HEATER ~ ": максимум " ~ limit ~ "°." %}                            # ...часть 2 (имя и лимит)
    RESPOND TYPE=error MSG="{msg}"                                          # Сообщаем о превышении лимита
    {% if printing %}                                                       # Если превышение случилось во время печати
      {% set msg = "Превышение лимита во время печати — отмена!" %}         # Текст предупреждения об отмене
      RESPOND TYPE=error MSG="{msg}"                                        # Предупреждаем об отмене
      CANCEL_PRINT                                                          # Отменяем печать
    {% endif %}                                                             # Конец проверки печати

  {% else %}                                                                # Цель в пределах лимита
    {% set bed_high = cfg.bed_high_temp|float %}                            # Порог «горячего» стола
    {% set cham_req = cfg.chamber_required|float %}                         # Требуемая температура камеры
    {% set cham = "heater_generic chamber" %}                               # Полное имя объекта камеры

    # --- Камера прогрета? (камеры нет в конфиге — проверку пропускаем) ---
    {% set cham_ok = cham not in printer                                    # Камера «в порядке», если её нет в конфиге...
      or printer[cham].temperature|float >= cham_req %}                     # ...или она уже прогрета до требуемой

    # --- Защита стола от температурного шока ---
    {% if is_bed and TARGET > bed_high and not cham_ok %}                   # Горячий стол при холодной камере — запрещено
      {% set msg = "Прогрейте камеру до " ~ cham_req                        # Текст требования, часть 1...
        ~ "° для стола выше " ~ bed_high ~ "°!" %}                          # ...часть 2 (порог стола)
      RESPOND TYPE=error MSG="{msg}"                                        # Требуем прогреть камеру
      {% if printing %}                                                     # Если это во время печати
        {% set msg = "Холодная камера при горячем столе"                    # Текст предупреждения, часть 1...
          ~ " во время печати — отмена!" %}                                 # ...часть 2
        RESPOND TYPE=error MSG="{msg}"                                      # Предупреждаем об отмене
        CANCEL_PRINT                                                        # Отменяем печать
      {% endif %}                                                           # Конец проверки печати
    {% elif is_bed %}                                                       # Зона стола, нагрев разрешён
      {% for z in cfg.bed_zones if z in found %}                            # Перебираем существующие зоны стола
        SET_HEATER_TEMPERATURE_BASE HEATER={z} TARGET={TARGET}              # Задаём цель каждой зоне
      {% endfor %}                                                          # Конец перебора зон
    {% else %}                                                              # Не стол — обычный нагрев без спецпроверок
      SET_HEATER_TEMPERATURE_BASE HEATER={HEATER} TARGET={TARGET}           # Устанавливаем температуру напрямую
    {% endif %}                                                             # Конец проверки защиты стола
  {% endif %}                                                               # Конец проверки лимита

# ==============================================================================
# МАКРОС: M104
# Назначение: Установка температуры экструдера без ожидания прогрева. Обёртка
# над кастомным SET_HEATER_TEMPERATURE (с проверкой лимитов). Штатный M104
# переименован в M1041.
# ==============================================================================
[gcode_macro M104]
rename_existing: M1041
description: Установить температуру экструдера (без ожидания)
gcode:
  {% set target = params.S | default(0) | float %}                                          # Температура из параметра S (по умолчанию 0)
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target}                                    # Задаём температуру экструдера через проверку лимитов


# ==============================================================================
# МАКРОС: M109
# Назначение: Установка температуры экструдера С ожиданием прогрева. Ждёт только
# при цели > 0, чтобы M109 S0 не зависал. Штатный M109 переименован в M1091.
# ==============================================================================
[gcode_macro M109]
rename_existing: M1091
description: Установить температуру экструдера и дождаться нагрева
gcode:
  {% set target = params.S | default(0) | float %}                                          # Температура из параметра S (по умолчанию 0)
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target}                                    # Задаём температуру экструдера
  {% if target > 0 %}                                                                       # Ждём только при реальном нагреве (цель > 0)
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target}                                       # Ждём выхода экструдера на температуру
  {% endif %}                                                                               # Конец проверки цели


# ==============================================================================
# МАКРОС: M140
# Назначение: Установка температуры стола без ожидания. Обёртка над кастомным
# SET_HEATER_TEMPERATURE (проверка лимитов и защита от температурного шока).
# ==============================================================================
[gcode_macro M140]
description: Температура стола, все зоны (без ожидания)
gcode:
  _BED_SET_ALL TARGET={params.S|default(0)|float}


# ==============================================================================
# МАКРОС: M190
# Назначение: Установка температуры стола С ожиданием прогрева. Устанавливает по
# короткому имени (heater_bed), а ждёт по полному (heater_generic heater_bed),
# так как стол объявлен через heater_generic.
# ==============================================================================
[gcode_macro M190]
description: Температура стола, все зоны (с ожиданием)
gcode:
  {% set t = params.S|default(0)|float %}
  _BED_SET_ALL TARGET={t}
  _BED_WAIT_ALL TARGET={t}


# =============================================================================
#  BED_TEMP — задать температуру ВСЕМ активным зонам стола одной командой.
#  Замена ручного SET_HEATER_TEMPERATURE (который греет только одну зону).
#  Активными считаются зоны, реально присутствующие в конфиге модели.
# =============================================================================
[gcode_macro BED_TEMP]
description: Задать T всем активным зонам стола. Параметр: TARGET=
gcode:
  {% set t = params.TARGET|default(0)|float %}
  _BED_SET_ALL TARGET={t}
  RESPOND MSG="Все активные зоны стола -> {t}C"

# ==============================================================================
# МАКРОС: _BED_WAIT_ALL (служебный)
# Назначение: Ждёт прогрева всех зон стола из bed_zones, реально присутствующих
# в конфиге. Полные имена сенсоров берутся из списка нагревателей Klipper.
# При цели 0 не ждёт.
# ==============================================================================
[gcode_macro _BED_WAIT_ALL]                                                 # Объявляем служебный макрос
description: Дождаться прогрева всех зон стола. Служебный.                  # Описание для интерфейса
gcode:                                                                      # Начало тела макроса
  {% set target = params.TARGET|default(0)|float %}                         # Целевая температура (по умолчанию 0)
  {% set cfg = printer["gcode_macro SET_HEATER_TEMPERATURE"] %}             # Берём список зон из основного макроса
  {% if target > 0 %}                                                       # Ждём только при реальном нагреве
    {% for h in printer.heaters.available_heaters %}                        # Перебираем все нагреватели (полные имена)
      {% if h.split(" ")[-1] in cfg.bed_zones %}                            # Берём только зоны стола
        TEMPERATURE_WAIT SENSOR="{h}" MINIMUM={target - 1}                  # Ждём выхода зоны на температуру (допуск 1°)
      {% endif %}                                                           # Конец проверки зоны
    {% endfor %}                                                            # Конец перебора нагревателей
  {% endif %}                                                               # Конец проверки цели


[gcode_macro _BED_WAIT_ALL]
description: Дождаться прогрева всех зон стола (автоопределение). Служебный.
gcode:
  {% set t = params.TARGET|float %}
  {% if t > 0 %}
    {% for obj in printer %}
      {% if obj.startswith('heater_generic heater_bed') %}
        TEMPERATURE_WAIT SENSOR="{obj}" MINIMUM={t - 1}
      {% endif %}
    {% endfor %}
  {% endif %}


# ==============================================================================
# МАКРОС: M141
# Назначение: Установка температуры термокамеры без ожидания. Обёртка над
# кастомным SET_HEATER_TEMPERATURE с проверкой лимитов.
# ==============================================================================
[gcode_macro M141]
description: Установить температуру термокамеры (без ожидания)
gcode:
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)|float}                  # Задаём температуру камеры (короткое имя)


# ==============================================================================
# МАКРОС: M191
# Назначение: Установка температуры термокамеры С ожиданием прогрева. Задаёт
# температуру через M141, а ждёт по полному имени сенсора (heater_generic
# chamber), так как камера объявлена через heater_generic.
# ==============================================================================
[gcode_macro M191]
description: Установить температуру термокамеры и дождаться нагрева
gcode:
  M141 S{params.S | default(0) | float}                                                     # Задаём температуру камеры без ожидания
  TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={params.S | default(0) | float}  # Ждём прогрева камеры (полное имя сенсора)


# ==============================================================================
# МАКРОС: SET_PRESSURE_ADVANCE
# Назначение: Обёртка над штатным SET_PRESSURE_ADVANCE, которая запоминает
# текущие значения pressure advance и smooth time в переменных макроса. При
# вызове без параметра берёт последнее сохранённое значение.
# ==============================================================================
[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: SET_PRESSURE_ADVANCE1                                                                 # Штатную команду прячем в SET_PRESSURE_ADVANCE1
variable_current_advance: 0                                                                            # Стартовое значение pressure advance
variable_current_smooth_time: 0.04                                                                     # Стартовое время сглаживания PA, с
gcode:
  {% set current_extruder = printer.toolhead.extruder %}                                               # Активный экструдер (для мультиэкструдера)
  {% set self = printer["gcode_macro SET_PRESSURE_ADVANCE"] %}                                         # Ссылка на переменные этого макроса

  # --- Берём значения из параметров или из сохранённого состояния ---
  {% set new_advance = params.ADVANCE|default(self.current_advance) %}                                 # ADVANCE из параметра или прошлое значение
  {% set new_smooth_time = params.SMOOTH_TIME|default(self.current_smooth_time) %}                     # SMOOTH_TIME из параметра или прошлое значение
  {% set extruder = params.EXTRUDER|default(current_extruder) %}                                       # Экструдер из параметра или текущий

  # --- Сохраняем новое состояние в память ---
  SET_GCODE_VARIABLE MACRO=SET_PRESSURE_ADVANCE VARIABLE=current_advance VALUE={new_advance}           # Сохраняем новое значение PA в память
  SET_GCODE_VARIABLE MACRO=SET_PRESSURE_ADVANCE VARIABLE=current_smooth_time VALUE={new_smooth_time}  # Сохраняем новое время сглаживания в память

  # --- Применяем через оригинальную команду Klipper ---
  SET_PRESSURE_ADVANCE1 EXTRUDER={extruder} ADVANCE={new_advance} SMOOTH_TIME={new_smooth_time}        # Применяем PA к экструдеру штатной командой


# ==============================================================================
# МАКРОС: M900
# Назначение: Marlin-совместимая установка pressure advance. Параметр K — фактор
# PA, E — номер экструдера. Транслирует K в ADVANCE нашей обёртки
# SET_PRESSURE_ADVANCE. Без K не делает ничего.
# ==============================================================================
[gcode_macro M900]
description: Установка pressure advance (Marlin-совместимая, параметр K)
gcode:
  {% if 'K' in params %}                                                                               # Без параметра K ничего не делаем
    {% if 'E' in params %}                                                                             # Если задан номер экструдера
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}                                      # Применяем K как ADVANCE к нужному экструдеру
    {% else %}                                                                                         # Номер экструдера не задан
      SET_PRESSURE_ADVANCE ADVANCE={params.K}                                                          # Применяем K к активному экструдеру
    {% endif %}                                                                                        # Конец проверки E
  {% endif %}                                                                                          # Конец проверки K


# ==============================================================================
# МАКРОС: M106
# Назначение: Переопределяет M106 (включение обдува детали). Прячет нативный
# M106, который ищет несуществующую секцию [fan], и переводит скорость 0..255 в
# долю 0.0..1.0 для кастомного вентилятора extruder_fan.
# ==============================================================================
[gcode_macro M106]
description: Включение обдува детали (кастомный extruder_fan)
gcode:
  {% set speed = params.S | default(0) | float / 255.0 %}                                              # Пересчёт 0..255 в долю 0.0..1.0
  SET_FAN_SPEED FAN=extruder_fan SPEED={speed}                                                         # Задаём скорость кастомного обдува детали

# ==============================================================================
# МАКРОС: M107
# Назначение: Выключение обдува детали. Просто вызывает M106 с нулевой скоростью.
# ==============================================================================
[gcode_macro M107]
description: Выключение обдува детали
gcode:
  M106 S0                                                                                     # Обдув на 0 = выключить вентилятор


# ==============================================================================
# МАКРОС: BED_MESH_CALIBRATE
# Назначение: Переопределяет калибровку сетки стола. Хоумит оси при необходимости,
# именует профиль по целевой температуре стола, пробрасывает параметры адаптива
# и паркует голову после калибровки.
# ==============================================================================
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}                                           # Если оси не запаркованы
    G28                                                                                       # Хоуминг всех осей
  {% endif %}                                                                                 # Конец проверки хоуминга

  {% set bed_temp = printer["heater_generic heater_bed"].target | default(0) | int %}         # Целевая температура стола (для имени профиля)
  {% set profile_name = (bed_temp | string ~ "°C") if bed_temp > 0 else "Текущий" %}          # Имя профиля: "<t>°C" или "Текущий"

  # --- Параметры адаптива (по умолчанию 0 — полная сетка при ручном вызове) ---
  {% set adaptive = params.ADAPTIVE | default(0) %}                                           # Флаг адаптивной сетки под деталь
  {% set margin = params.ADAPTIVE_MARGIN | default(0) %}                                      # Запас области вокруг детали, мм

  BED_MESH_CALIBRATE_BASE PROFILE={profile_name} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={margin}  # Запускаем штатную калибровку сетки

  _PARK                                                                           # Паркуем голову после калибровки
  RESPOND MSG="Калибровка сетки стола завершена"                                              # Сообщаем о завершении


# ==============================================================================
# МАКРОС: LOAD_BED_MESH
# Назначение: Загружает сохранённый профиль сетки стола по имени, вычисленному
# из целевой температуры стола (та же логика имён, что в BED_MESH_CALIBRATE).
# ==============================================================================
[gcode_macro LOAD_BED_MESH]
description: Загрузка профиля сетки по температуре стола
gcode:
  {% set bed_temp = printer["heater_generic heater_bed"].target | default(0) | int %}         # Целевая температура стола (для имени профиля)
  {% set profile_name = (bed_temp | string ~ "°C") if bed_temp > 0 else "Текущий" %}          # Имя профиля: "<t>°C" или "Текущий"

  BED_MESH_PROFILE LOAD={profile_name}                                                        # Загружаем профиль сетки по имени
  RESPOND MSG="Загружен профиль сетки: {profile_name}"                                        # Сообщаем, какой профиль загружен


# ==============================================================================
# МАКРОС: PID_CALIBRATE
# Назначение: Переопределяет PID-калибровку с проверкой имени нагревателя.
# Допускает любой нагреватель, реально существующий в конфиге. При калибровке
# ЛЮБОЙ зоны стола остальные зоны из bed_zones греются до того же TARGET
# штатным регулятором (отключается heat_all_zones: 0).
# После успешной калибровки гасит нагрев и сохраняет результат.
# ВНИМАНИЕ: SAVE_CONFIG перезапускает прошивку. При неизвестном нагревателе
# только выводит ошибку без рестарта.
# ==============================================================================
[gcode_macro PID_CALIBRATE]                                                 # Переопределяем штатную команду макросом
rename_existing: PID_CALIBRATE_BASE                                         # Штатную команду прячем в PID_CALIBRATE_BASE
description: PID-калибровка с прогревом остальных зон стола                 # Описание для интерфейса
variable_heat_all_zones: 1                                                  # 1 — греть соседние зоны при калибровке стола
gcode:                                                                      # Начало тела макроса
  # --- Параметры с значениями по умолчанию ---
  {% set heater = params.HEATER|default("extruder")|string %}               # Имя нагревателя (по умолчанию extruder)
  {% set target = params.TARGET|default(200)|float %}                       # Целевая температура калибровки (по умолчанию 200)
  {% set pid = printer["gcode_macro PID_CALIBRATE"] %}                      # Ссылка на переменные этого макроса
  {% set cfg = printer["gcode_macro SET_HEATER_TEMPERATURE"] %}             # Берём список зон из основного макроса

  # --- Какие нагреватели реально есть в конфиге ---
  {% set found = [] %}                                                      # Список коротких имён нагревателей
  {% for h in printer.heaters.available_heaters %}                          # Перебираем все нагреватели Klipper
    {% set _ = found.append(h.split(" ")[-1]) %}                            # Запоминаем короткое имя (без heater_generic)
  {% endfor %}                                                              # Конец перебора нагревателей

  # --- Определяем тип и наличие нагревателя ---
  {% set is_bed = heater in cfg.bed_zones %}                                # True для любой зоны стола
  {% set known = heater in found %}                                         # Нагреватель реально есть в конфиге
  {% set others = pid.heat_all_zones|int == 1 and is_bed %}                 # Нужно ли греть соседние зоны

  # --- Калибруем, только если нагреватель известен ---
  {% if known %}                                                            # Известный нагреватель
    {% if others %}                                                         # Калибруем зону стола с прогревом соседей
      {% for z in cfg.bed_zones if z in found and z != heater %}            # Существующие зоны, кроме калибруемой
        SET_HEATER_TEMPERATURE_BASE HEATER={z} TARGET={target}              # Греем соседнюю зону до цели калибровки
      {% endfor %}                                                          # Конец перебора зон
    {% endif %}                                                             # Конец подготовки зон стола
    PID_CALIBRATE_BASE HEATER={heater} TARGET={target}                      # Запускаем базовую PID-калибровку
    TURN_OFF_HEATERS                                                        # Гасим все нагреватели после калибровки
    SAVE_CONFIG                                                             # Сохраняем результат (перезапускает прошивку)
  {% else %}                                                                # Неизвестное или отсутствующее имя нагревателя
    RESPOND TYPE=error MSG="Ошибка: Нагреватель {heater} не найден!"        # Сообщаем об ошибке (без рестарта)
  {% endif %}                                                               # Конец выбора нагревателя

