# ==============================================================================
# ПОДКЛЮЧЕНИЕ ФАЙЛОВ МАКРОСОВ
# ==============================================================================
[include cancel_pause_resume.cfg]                        # Пауза / возобновление / отмена печати
[include load_unload_filament.cfg]                       # Загрузка и выгрузка филамента
[include overrides.cfg]                                  # Переопределения M-команд и лимиты нагрева
[include power.cfg]                                      # Выключение принтера и подсветка
[include start_end_print.cfg]                            # Стартовая и финишная последовательности печати
[include z_calibration.cfg]                              # Калибровка Z и работа со щупом
[include ../shell_command.cfg]                           # Shell-команды (USB, бэкап)
[include servis.cfg]                                     # Сервисные макросы



# ==============================================================================
# ХРАНЕНИЕ ПЕРЕМЕННЫХ
# ==============================================================================
[save_variables]
filename: /home/biqu/printer_data/config/variables.cfg   # Файл сохраняемых переменных

# ==============================================================================
# БАЗОВЫЕ СЛУЖЕБНЫЕ СЕКЦИИ
# ==============================================================================
[respond]                                                # Вывод сообщений в консоль (RESPOND)
[pause_resume]                                           # Механизм паузы/возобновления
[display_status]                                         # Статус для дисплея и веб-интерфейса

[force_move]
enable_force_move: True                                  # Разрешаем принудительное движение осей (FORCE_MOVE)

[exclude_object]                                         # Поддержка исключения объектов при печати

# ==============================================================================
# ВИРТУАЛЬНАЯ SD-КАРТА
# Назначение: Печать с хоста + аварийный сценарий при ошибке печати.
# ==============================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes                              # Каталог с G-code файлами
on_error_gcode:
    RESPOND TYPE=error MSG="Ошибка печати"               # Сообщаем об ошибке печати
    M84                                                  # Отключаем шаговые двигатели
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0      # Гасим экструдер
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0    # Гасим стол
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0       # Гасим камеру

# ==============================================================================
# ТАЙМАУТ ПРОСТОЯ
# Назначение: Что делать при простое. Гасит подсветку, нагрев и моторы.
# ==============================================================================
[idle_timeout]
gcode:
    SET_PIN PIN=Extruder_led VALUE=0                     # Выключаем подсветку сопла
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0      # Гасим экструдер
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0    # Гасим стол
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0       # Гасим камеру
    M84                                                  # Отключаем шаговые двигатели
timeout: 86400                                           # Таймаут простоя, с (24 часа)