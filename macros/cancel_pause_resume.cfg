# ==============================================================================
# МАКРОС: PAUSE
# Назначение: Безопасная приостановка печати. Сохраняет положение, делает откат
# филамента, вызывает штатную паузу и паркует голову. Не срабатывает, если
# печать уже стоит на паузе или не запущена.
# ==============================================================================
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE                                                    # Штатную команду прячем в PAUSE_BASE
variable_extrude: 1.0                                                          # Длина отката/подачи филамента, мм
gcode:
  {% if printer.print_stats.filename != "" %}                                  # Только если идёт печать (есть имя файла)
    {% if printer['pause_resume'].is_paused|int == 0 %}                        # Только если ещё не на паузе (0 = печатает)
      SAVE_GCODE_STATE NAME=PAUSE_state                                        # Сохраняем состояние (координаты, режимы)
      {% set E = printer["gcode_macro PAUSE"].extrude|float %}                 # Длина отката из переменной extrude, мм
      M83                                                                      # Относительный режим экструдера
      G92 E0                                                                   # Обнуляем позицию экструдера
      G1 E-{E} F3600                                                           # Откат филамента на E мм (3600 мм/мин)
      G92 E0                                                                   # Снова обнуляем позицию экструдера
      PAUSE_BASE                                                               # Штатная пауза Klipper (стоп движения/очереди)
      _SAFE_PARK                                                               # Безопасная парковка (подъём Z + отвод в угол)
    {% endif %}                                                                # Конец проверки паузы
  {% endif %}                                                                  # Конец проверки печати


# ==============================================================================
# МАКРОС: RESUME
# Назначение: Безопасное продолжение печати. Возвращает филамент, доводит голову
# до точки паузы и только потом снимает паузу, чтобы пластик не выдавливался в
# воздух. Не срабатывает, если принтер не на паузе.
# ==============================================================================
[gcode_macro RESUME]
rename_existing: RESUME_BASE                                                   # Штатную команду прячем в RESUME_BASE
gcode:
  {% if printer.print_stats.filename != "" %}                                  # Только если идёт печать (есть имя файла)
    {% if printer['pause_resume'].is_paused|int == 1 %}                        # Только если реально на паузе (1 = пауза)
      {% set E = printer['gcode_macro PAUSE'].extrude|float %}                 # Длина подачи из переменной PAUSE.extrude
      M83                                                                      # Относительный режим экструдера
      G92 E0                                                                   # Обнуляем позицию экструдера
      G1 E{E} F3600                                                            # Возврат филамента на E мм (компенсация отката)
      G92 E0                                                                   # Обнуляем позицию экструдера
      RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100               # Возвращаем голову в точку паузы (100 мм/с)
      RESUME_BASE                                                              # И только теперь снимаем паузу
    {% endif %}                                                                # Конец проверки паузы
  {% endif %}                                                                  # Конец проверки печати


# ==============================================================================
# МАКРОС: CANCEL_PRINT
# Назначение: Отмена печати с «причёсыванием»: откат филамента, парковка (если
# оси отхоумлены), опускание стола вниз, выключение всех нагревателей и обдува.
# ==============================================================================
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE                                             # Штатную команду прячем в CANCEL_PRINT_BASE
gcode:
  {% if printer.print_stats.filename != "" %}                                  # Только если печать активна
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}                   # Длина отката из переменной PAUSE.extrude
    M83                                                                        # Относительный режим экструдера
    G92 E0                                                                     # Обнуляем позицию экструдера
    G1 E-{E} F3600                                                             # Откат филамента на E мм
    G92 E0                                                                     # Обнуляем позицию экструдера
    {% if "xyz" in printer.toolhead.homed_axes %}                              # Парковка возможна только после хоуминга
      _SAFE_PARK                                                               # Безопасная парковка (подъём Z + отвод в угол)
      G1 Z{printer.configfile.config.stepper_z.position_max | float - 1}       # Опускаем стол в самый низ (position_max − 1)
    {% endif %}                                                                # Конец проверки хоуминга
    CLEAR_PAUSE                                                                # Сбрасываем флаг паузы Klipper
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0                            # Гасим экструдер
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0                          # Гасим стол
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0                             # Гасим камеру
    CANCEL_PRINT_BASE                                                          # Штатная отмена (очистка очереди/статистики)
    M107                                                                       # Выключаем обдув детали
  {% endif %}                                                                  # Конец проверки печати


# ==============================================================================
# МАКРОС: _SAFE_PARK
# Назначение: Поднимает голову над текущим местом печати, чтобы не поцарапать
# деталь, и уводит каретку в угол через _PARK1. Z поднимается относительно, а не
# в абсолют, чтобы работать на любой высоте детали.
# ==============================================================================
[gcode_macro _SAFE_PARK]
description: Безопасная парковка с подъёмом Z
gcode:
  G91                                                                          # Относительные координаты
  G1 Z10 F300                                                                  # Поднимаем стол на 10 мм от детали (+Z = вниз)
  G90                                                                          # Абсолютные координаты
  _PARK                                                                        # Отвод каретки в угол (Z уже поднят выше)


# ==============================================================================
# МАКРОС: _PARK
# Назначение: Парковка каретки в угол без движения по Z (Z уже поднят вызывающим
# _SAFE_PARK). Используется при паузе/отмене, где деталь трогать нельзя.
# ==============================================================================
[gcode_macro _PARK]
description: Парковка в угол без движения Z
gcode:
  G90                                                                          # Абсолютное позиционирование
  G1 X{printer.configfile.config.stepper_x.position_max | float - 1} F6000    # X в крайнее правое (макс − 1 мм), 100 мм/с
  G1 Y{printer.configfile.config.stepper_y.position_max | float - 10} F6000   # Y в крайнее заднее (макс − 10 мм)