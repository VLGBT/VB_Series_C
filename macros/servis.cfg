# ==============================================================================
# МАКРОС: _SELFTEST
# Назначение: Автоматическая проверка безопасных подсистем без движения осей и
# без нагрева. Читает температуры, опрашивает концевики/пробу/датчики филамента,
# гоняет подсветку и вентиляторы, выводит отчёт и список ручных проверок.
# ⚠️ Движение и нагрев НЕ автоматизированы — их проверяй вручную по чек-листу.
# ==============================================================================
[gcode_macro _SELFTEST]
description: Безопасная самопроверка подсистем (без движения и нагрева)
gcode:
  RESPOND MSG="===== SELFTEST: старт ====="                                    # Заголовок отчёта

  # --- Температуры (чтение датчиков) ---
  RESPOND MSG="--- Температуры ---"                                            # Секция температур
  {% set e = printer.extruder.temperature | round(1) %}                        # Температура экструдера
  {% set b = printer["heater_generic heater_bed"].temperature | round(1) %}    # Температура стола
  {% set c = printer["heater_generic chamber"].temperature | round(1) %}       # Температура камеры (комбинированная)
  {% set c1 = printer["temperature_sensor _CH1"].temperature | round(1) %}     # Датчик камеры CH1
  {% set c2 = printer["temperature_sensor _CH2"].temperature | round(1) %}     # Датчик камеры CH2
  {% set host = printer["temperature_sensor Хост"].temperature | round(1) %}   # Температура хоста
  RESPOND MSG="Экструдер: {e}°C | Стол: {b}°C | Камера: {c}°C"                  # Вывод основных температур
  RESPOND MSG="CH1: {c1}°C | CH2: {c2}°C | Хост: {host}°C"                      # Вывод датчиков камеры и хоста

  # --- Концевики и проба (опрос состояния пинов) ---
  RESPOND MSG="--- Концевики и проба ---"                                      # Секция эндстопов
  QUERY_ENDSTOPS                                                               # Печатает состояние X/Y/Z-концевиков
  QUERY_PROBE                                                                  # Печатает состояние пробы (PF1)

  # --- Датчики филамента ---
  RESPOND MSG="--- Датчики филамента ---"                                      # Секция филамента
  {% set fs = printer['filament_switch_sensor 0'].filament_detected %}         # Состояние датчика наличия
  RESPOND MSG="Наличие филамента (switch 0): {fs}"                             # Вывод состояния датчика наличия

  # --- Подсветка сопла ---
  RESPOND MSG="--- Подсветка ---"                                              # Секция подсветки
  SET_PIN PIN=Extruder_led VALUE=1                                             # Включаем подсветку
  G4 P1000                                                                     # Пауза 1 с (визуально проверить)
  SET_PIN PIN=Extruder_led VALUE=0                                             # Выключаем подсветку
  RESPOND MSG="Подсветка мигнула (проверь визуально)"                          # Подсказка для глаза

  # --- Обдув детали (extruder_fan через M106) ---
  RESPOND MSG="--- Вентиляторы ---"                                            # Секция вентиляторов
  M106 S128                                                                    # Обдув детали ~50%
  G4 P2000                                                                     # Крутим 2 с
  M106 S255                                                                    # Обдув на максимум (ограничен max_power 0.9)
  G4 P2000                                                                     # Крутим 2 с
  M107                                                                         # Выключаем обдув
  RESPOND MSG="Обдув детали прогнан 50%->макс->выкл (проверь на слух/глаз)"    # Подсказка для проверки

  # --- Итог и ручные проверки ---
  RESPOND MSG="===== SELFTEST: авто-часть завершена ====="                     # Конец авто-части
  RESPOND TYPE=error MSG="ВРУЧНУЮ (не автоматизировано, опасно):"              # Заголовок ручных проверок (заметный)
  RESPOND MSG="1. Направление осей: FORCE_MOVE (Z '+' = стол ВНИЗ!)"           # Ручная проверка направлений
  RESPOND MSG="2. Хоуминг: G28 (Z паркуется вниз в максимум)"                  # Ручная проверка хоуминга
  RESPOND MSG="3. Проба: PROBE / PROBE_ACCURACY в центре стола"                # Ручная проверка пробы
  RESPOND MSG="4. Нагрев: M104/M140/M141 + проверка лимитов"                   # Ручная проверка нагрева
  RESPOND MSG="5. PAUSE/RESUME/CANCEL_PRINT на реальной печати"                # Ручная проверка сценариев печати
  RESPOND MSG="Полный список: printer_selftest.md"                             # Ссылка на чек-лист