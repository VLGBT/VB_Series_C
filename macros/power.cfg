#==============================================================================
# МАКРОС: _TURN_OFF
# Назначение: Полное безопасное выключение принтера. Гасит подсветку сопла, все
# нагреватели, обдув и моторы, сбрасывает флаг паузы. Используется как аварийное
# и штатное «всё выключить».
# ==============================================================================
[gcode_macro _TURN_OFF]
description: Полное выключение нагрева, моторов и подсветки
gcode:
  SET_PIN PIN=Extruder_led VALUE=0                                                   # Выключаем светодиод сопла

  # --- Надёжное выключение всех нагревателей напрямую ---
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0                                    # Выключаем экструдер
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0                                  # Выключаем стол
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0                                     # Выключаем термокамеру

  M107                                                                               # Выключаем вентилятор обдува детали (кастомный макрос)
  M84                                                                                # Отключаем шаговые двигатели (разблокируем валы)
  CLEAR_PAUSE                                                                        # Сбрасываем внутренний флаг паузы Klipper (на случай вызова вне отмены печати)


# ==============================================================================
# МАКРОС: TOGGLE_LED
# Назначение: Переключает подсветку сопла. Читает текущее состояние пина и
# инвертирует его: выкл → вкл, вкл → выкл.
# ==============================================================================
[gcode_macro TOGGLE_LED]
description: Переключение подсветки сопла (вкл/выкл)
gcode:
  # --- Определяем новое состояние по текущему значению пина ---
  {% set state = 1 if printer['output_pin Extruder_led'].value|int == 0 else 0 %}  # Если сейчас 0 (выкл) → ставим 1 (вкл), иначе 0
  SET_PIN PIN=Extruder_led VALUE={state}                                             # Применяем новое состояние подсветки