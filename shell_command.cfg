# ==============================================================================
# СЕКЦИЯ 1: КОМАНДЫ LINUX (Определяем, что будут делать команды)
# ==============================================================================


# ==============================================================================
# КОМАНДА: REMOVE
# Назначение: Отмонтирует USB-накопитель от /media. Ключ -l (lazy) отключает
# накопитель сразу, даже если к нему ещё есть обращения.
# ==============================================================================
[gcode_shell_command REMOVE]                                       # Объявляем shell-команду REMOVE
command: sudo umount -l /media                                     # Ленивое отмонтирование накопителя
timeout: 600                                                       # Максимальное время выполнения, с
verbose: False                                                     # Не выводить вывод команды в консоль


# ==============================================================================
# КОМАНДА: DELETE
# Назначение: Удаляет папку USB с копиями G-code из каталога gcodes после
# извлечения накопителя.
# ==============================================================================
[gcode_shell_command DELETE]                                       # Объявляем shell-команду DELETE
command: sudo rm -R /home/biqu/printer_data/gcodes/USB             # Рекурсивно удаляем папку USB
timeout: 600                                                       # Максимальное время выполнения, с
verbose: False                                                     # Не выводить вывод команды в консоль


# ==============================================================================
# КОМАНДА: INSTALL
# Назначение: Монтирует USB-накопитель с меткой тома VOLGOBOT в /media.
# ==============================================================================
[gcode_shell_command INSTALL]                                      # Объявляем shell-команду INSTALL
command: sudo mount -L VOLGOBOT /media                             # Монтируем том по метке в /media
timeout: 600                                                       # Максимальное время выполнения, с
verbose: False                                                     # Не выводить вывод команды в консоль


# ==============================================================================
# КОМАНДА: COPY
# Назначение: Копирует с накопителя в gcodes/USB только файлы *.gcode,
# сохраняя структуру папок. Сравнение по контрольной сумме — копируются
# только изменённые файлы.
# ==============================================================================
[gcode_shell_command COPY]                                         # Объявляем shell-команду COPY
command: rsync -avh --checksum --progress                          # Архивный режим, сверка по сумме, прогресс
  --include='*.gcode' --include='*/' --exclude='*'                 # Берём только *.gcode и папки, остальное нет
  /media/ /home/biqu/printer_data/gcodes/USB/                      # Откуда и куда копируем
timeout: 600                                                       # Максимальное время выполнения, с
verbose: False                                                     # Не выводить вывод команды в консоль


# ==============================================================================
# КОМАНДА: BACKUP
# Назначение: Упаковывает каталог config в архив backups/<хост>_<дата>.tar.gz.
# Старые архивы (*.gz) в новый архив не включаются.
# ==============================================================================
[gcode_shell_command BACKUP]                                       # Объявляем shell-команду BACKUP
command: bash -c "                                                 # Запускаем скрипт через bash
  DIR=/home/biqu/printer_data/config                               # Каталог конфигурации
  NAME=$(hostname)_$(date +%d-%m-%Y).tar.gz                        # Имя архива: хост и текущая дата
  tar --exclude='*.gz' -czf $DIR/backups/$NAME $DIR"               # Архивируем config без старых архивов
timeout: 600                                                       # Максимальное время выполнения, с
verbose: False                                                     # Не выводить вывод команды в консоль


# ==============================================================================
# СЕКЦИЯ 2: МАКРОСЫ (Вызывают команды, описанные выше)
# ==============================================================================


# ==============================================================================
# МАКРОС: _USB_REMOVE (служебный)
# Назначение: Безопасно извлекает USB-накопитель: отмонтирует его и удаляет
# локальную папку с копиями G-code.
# ==============================================================================
[gcode_macro _USB_REMOVE]                                          # Объявляем служебный макрос
description: Извлечь USB-накопитель и удалить его копию            # Описание для интерфейса
gcode:                                                             # Начало тела макроса
  RUN_SHELL_COMMAND CMD=REMOVE                                     # Отмонтируем накопитель
  RUN_SHELL_COMMAND CMD=DELETE                                     # Удаляем папку с копиями G-code
  RESPOND TYPE=echo MSG="USB накопитель демонтирован!"             # Сообщаем об извлечении


# ==============================================================================
# МАКРОС: _USB_INSTALL (служебный)
# Назначение: Подключает USB-накопитель и копирует с него файлы G-code в
# папку gcodes/USB.
# ==============================================================================
[gcode_macro _USB_INSTALL]                                         # Объявляем служебный макрос
description: Подключить USB-накопитель и скопировать G-code        # Описание для интерфейса
gcode:                                                             # Начало тела макроса
  RUN_SHELL_COMMAND CMD=INSTALL                                    # Монтируем накопитель
  RESPOND TYPE=echo MSG="Пожалуйста подождите!"                    # Предупреждаем о копировании
  RUN_SHELL_COMMAND CMD=COPY                                       # Копируем файлы G-code
  RESPOND TYPE=echo MSG="USB накопитель установлен!"               # Сообщаем о готовности


# ==============================================================================
# МАКРОС: _BACKUP (служебный)
# Назначение: Создаёт архивную копию каталога конфигурации принтера.
# ==============================================================================
[gcode_macro _BACKUP]                                              # Объявляем служебный макрос
description: Сохранить архив конфигурации в backups                # Описание для интерфейса
gcode:                                                             # Начало тела макроса
  RUN_SHELL_COMMAND CMD=BACKUP                                     # Запускаем архивирование
  RESPOND TYPE=echo MSG="Бэкап конфигурации сохранен!"             # Сообщаем об успешном бэкапе


# ==============================================================================
# ОТЛОЖЕННЫЙ G-CODE: BACKUP
# Назначение: Автоматически запускает бэкап конфигурации через 1 секунду
# после каждого старта или перезапуска Klipper.
# ==============================================================================
[delayed_gcode BACKUP]                                             # Объявляем отложенный G-code
initial_duration: 1.0                                              # Запуск через 1 с после старта Klipper
gcode:                                                             # Начало тела блока
  _BACKUP                                                          # Выполняем бэкап конфигурации