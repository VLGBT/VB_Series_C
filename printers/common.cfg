[include ../macros/common.cfg]

# ==============================================================================
# СЕКЦИЯ: printer
# Назначение: Базовые кинематические ограничения принтера — тип кинематики,
# максимальные скорости и ускорения по осям.
# ==============================================================================
[printer]
kinematics: corexy                                             # Кинематика CoreXY
max_velocity: 300                                              # Максимальная скорость, мм/с
max_accel: 5000                                                # Максимальное ускорение, мм/с²
max_z_velocity: 20                                             # Максимальная скорость оси Z, мм/с
max_z_accel: 50                                                # Максимальное ускорение оси Z, мм/с²


# ==============================================================================
# СЕКЦИЯ: homing_override
# Назначение: Переопределение G28. Полный хоуминг идёт в порядке Z→Y→X (Z вниз
# к концевику парковки, стол отводится от сопла). Блоки поосного хоуминга
# закомментированы — оставлены как задел на будущее.
# ==============================================================================
[homing_override]
gcode:
  {% set have_x = 'X' in params %}                             # Запрошен хоуминг X
  {% set have_y = 'Y' in params %}                             # Запрошен хоуминг Y
  {% set have_z = 'Z' in params %}                             # Запрошен хоуминг Z
  {% set home_all = not (have_x or have_y or have_z) %}        # Ни одна ось не указана — хоумим всё
  {% set homed = printer.toolhead.homed_axes %}                # Уже отхоумленные оси

  # --- Полный хоуминг, если параметры не заданы ---
  {% if home_all %}                                            # Если вызван просто G28
    G28_BASE Z                                                 # Хоумим Z (стол вниз к концевику PF2)
    G28_BASE Y                                                 # Хоумим Y
    G28_BASE X                                                 # Хоумим X
  {% endif %}                                                  # Конец полного хоуминга

# ==============================================================================
# РАЗДЕЛ: Моторы
# Назначение: Конфигурация шаговых двигателей осей X/Y/Z и экструдера, а также
# их драйверов TMC2209 (UART-режим, рабочие токи).
# ==============================================================================

# ------------------------------------------------------------------------------
# Ось X
# ------------------------------------------------------------------------------
[stepper_x]
step_pin: PE6                                                  # Пин шага
dir_pin: PE5                                                   # Пин направления
enable_pin: !PC14                                              # Пин включения (инверсный)
microsteps: 16                                                 # Микрошаги
rotation_distance: 40                                          # Дистанция за оборот, мм
endstop_pin: !PF4                                              # Концевик X (инверсный)
homing_speed: 40                                               # Скорость хоуминга, мм/с

[tmc2209 stepper_x]
uart_pin: PC13                                                 # UART-пин драйвера X
#diag_pin: PF4                                                 # DIAG (sensorless, не задействован)
run_current: 1                                                 # Рабочий ток, А

# ------------------------------------------------------------------------------
# Ось Y
# ------------------------------------------------------------------------------
[stepper_y]
step_pin: PE2                                                  # Пин шага
dir_pin: PE1                                                   # Пин направления
enable_pin: !PE4                                               # Пин включения (инверсный)
microsteps: 16                                                 # Микрошаги
rotation_distance: 40                                          # Дистанция за оборот, мм
endstop_pin: !PF3                                              # Концевик Y (инверсный)
position_endstop: 0                                            # Позиция концевика Y
homing_speed: 40                                               # Скорость хоуминга, мм/с

[tmc2209 stepper_y]
uart_pin: PE3                                                  # UART-пин драйвера Y
#diag_pin: PF3                                                 # DIAG (sensorless, не задействован)
run_current: 1                                                 # Рабочий ток, А

# ------------------------------------------------------------------------------
# Ось Z (инвертирована: +Z = стол вниз от сопла)
# ------------------------------------------------------------------------------
[stepper_z]
step_pin: PB8                                                  # Пин шага
dir_pin: PB7                                                   # Пин направления
enable_pin: !PE0                                               # Пин включения (инверсный)
microsteps: 16                                                 # Микрошаги
rotation_distance: 4                                           # Дистанция за оборот, мм
endstop_pin: PF2                                               # Концевик парковки Z
homing_speed: 20                                               # Скорость хоуминга, мм/с
second_homing_speed: 5                                         # Скорость повторного касания, мм/с
position_min: -10                                              # Мин. позиция Z (отладочный запас)

[tmc2209 stepper_z]
uart_pin: PB9                                                  # UART-пин драйвера Z
run_current: 1                                                 # Рабочий ток, А


# ==============================================================================
# СЕКЦИЯ: extruder
# Назначение: Конфигурация экструдера — механика подачи, нагреватель хотэнда,
# датчик температуры MAX31865 (PT1000 по software SPI на слоте M8) и драйвер.
# ==============================================================================
[extruder]
nozzle_diameter: 0.4                                           # Диаметр сопла, мм
step_pin: PC7                                                  # Пин шага экструдера
dir_pin: PC8                                                   # Пин направления
enable_pin: !PD2                                               # Пин включения (инверсный)
microsteps: 16                                                 # Микрошаги
rotation_distance: 4.774                                       # Дистанция за оборот (калибровка E), мм
filament_diameter: 1.75                                        # Диаметр филамента, мм
heater_pin: PA3                                                # Пин нагревателя хотэнда (HE0)
min_temp: 0                                                    # Минимальная температура
max_temp: 550                                                  # Максимальная температура
min_extrude_temp: 0                                            # Порог экструзии (0 = защита выключена!)
max_extrude_only_distance: 200                                 # Макс. длина «холостой» экструзии, мм
pressure_advance: 0                                            # Pressure Advance
pressure_advance_smooth_time: 0.040                            # Время сглаживания PA, с
max_extrude_cross_section: 5                                   # Лимит сечения экструзии, мм²

# --- Аналоговый PT1000 (отключён, заменён на MAX31865) ---
# sensor_type: PT1000
# sensor_pin: PC5                                              # T0
# pullup_resistor: 2200

# --- MAX31865 на слоте M8 (PT1000, software SPI) ---
sensor_type: MAX31865                                          # Тип датчика: MAX31865 RTD-усилитель
sensor_pin: PB6                                                # CS   = M8-EN
spi_software_sclk_pin: PB4                                     # SCLK = M8-STEP (плата: CLK)
spi_software_mosi_pin: PB3                                     # MOSI = M8-DIR  (плата: SDI)
spi_software_miso_pin: PB5                                     # MISO = M8-CS   (плата: SDO)
rtd_nominal_r: 1000                                            # PT1000: 1000 Ом при 0°C
rtd_reference_r: 4300                                          # После перепайки Rref 430 -> 4300 Ом
rtd_num_of_wires: 2                                            # Перемычки 2-wire запаяны

[tmc2209 extruder]
uart_pin: PC6                                                  # UART-пин драйвера экструдера
run_current: 0.800                                             # Рабочий ток, А


# ==============================================================================
# СЕКЦИЯ: probe
# Назначение: Датчик автокалибровки (проба типа Voron Tap, срыв по касанию
# соплом). Отдельный пин от концевика парковки Z. Медианная выборка из 3 касаний.
# ==============================================================================
[probe]
pin: !PF1                                                      # Пин пробы (инверсный), отдельно от PF2
x_offset: 0                                                    # Смещение пробы от сопла по X (Tap = 0)
y_offset: 0                                                    # Смещение пробы от сопла по Y (Tap = 0)
speed: 5                                                       # Скорость касания, мм/с
samples: 3                                                     # Число касаний на точку
sample_retract_dist: 2.0                                       # Откат между касаниями, мм (размыкает контакт)
lift_speed: 20                                                 # Скорость подъёма после касания, мм/с
samples_result: median                                         # Итог — медиана (отбрасывает грубое касание)
samples_tolerance: 2.0                                         # Допустимый разброс между касаниями, мм
samples_tolerance_retries: 3                                   # Сколько раз пробовать при превышении разброса


# ==============================================================================
# СЕКЦИЯ: bed_mesh
# Назначение: Компенсация неровности стола сеткой промеров. Используется в
# адаптивном режиме из _START_PRINT (сетка строится под областью детали).
# ==============================================================================
[bed_mesh]
speed: 100                                                     # Скорость перемещений при промере, мм/с
horizontal_move_z: 3                                           # Высота подъёма Z между точками, мм
algorithm: lagrange                                            # Алгоритм интерполяции
# fade_start: 0.1                                              # Высота начала сглаживания меша (откл.)
# fade_end: 3                                                  # Высота конца сглаживания меша (откл.)
probe_count: 5, 4                                              # Число точек сетки (X, Y)


# ==============================================================================
# РАЗДЕЛ: Нагреватели
# Назначение: Нагреватель стола, нагреватель термокамеры (комбинированный
# датчик из двух термисторов) и защиты verify_heater от перегрева/отказа.
# ==============================================================================

# ------------------------------------------------------------------------------
# Нагреватель стола (управляется первым термистором)
# ------------------------------------------------------------------------------
[heater_generic heater_bed]
heater_pin: PF9                                                # Пин управления нагревателем стола
sensor_type: ATC Semitec 104NT-4-R025H42G                     # Тип термистора
sensor_pin: PB0                                                # Пин управляющего термистора стола
min_temp: 0                                                    # Минимальная температура
max_temp: 220                                                  # Максимальная температура стола
max_power: 1.0                                                 # Макс. мощность нагрева (100%)

[verify_heater heater_bed]
max_error: 300                                                 # Допустимая накопленная ошибка
check_gain_time: 120                                           # Окно контроля прироста температуры, с
hysteresis: 5                                                  # Гистерезис удержания, °C
heating_gain: 2.0                                              # Мин. прирост за окно, °C (стол греется быстро)

# ------------------------------------------------------------------------------
# Нагреватель термокамеры (комбинированный датчик _CH1 + _CH2)
# ------------------------------------------------------------------------------
[heater_generic chamber]
heater_pin: PF7                                                # Пин нагревателя камеры
sensor_type: temperature_combined                             # Комбинированный сенсор
sensor_list: temperature_sensor _CH1, temperature_sensor _CH2  # Список объединяемых датчиков
combination_method: mean                                       # Метод объединения — среднее
maximum_deviation: 100                                         # Макс. расхождение датчиков, °C
min_temp: -100                                                 # Минимальная температура
max_temp: 220                                                  # Максимальная температура камеры

[temperature_sensor _CH1]
sensor_type: ATC Semitec 104NT-4-R025H42G                     # Тип термистора камеры CH1
sensor_pin: PA7                                                # Пин датчика CH1
min_temp: -100                                                 # Минимальная температура
max_temp: 250                                                  # Максимальная температура

[temperature_sensor _CH2]
sensor_type: ATC Semitec 104NT-4-R025H42G                     # Тип термистора камеры CH2
sensor_pin: PC4                                                # Пин датчика CH2
min_temp: -100                                                 # Минимальная температура
max_temp: 250                                                  # Максимальная температура

[verify_heater chamber]
max_error: 999                                                 # Высокий порог ошибки (камера греется медленно)
hysteresis: 30                                                 # Широкий гистерезис, °C
heating_gain: 0.1                                              # Малый требуемый прирост за окно, °C
check_gain_time: 120                                           # Окно контроля прироста температуры, с


# ==============================================================================
# РАЗДЕЛ: Вентиляторы и датчики температур
# Назначение: Подсветка сопла, датчик температуры хоста, вентилятор крышки,
# обдув детали, помпа охлаждения хотэнда и вентилятор холодной зоны.
# ==============================================================================

[multi_pin 1]
pins: PA4, PA5                                                 # Пара пинов под один логический вентилятор

# ------------------------------------------------------------------------------
# Подсветка сопла
# ------------------------------------------------------------------------------
[output_pin Extruder_led]
pin: PA1                                                       # Пин подсветки сопла
pwm: False                                                     # False = вкл/выкл (True для яркости)
value: 1                                                       # Стартовое состояние (1 = включена)

# ------------------------------------------------------------------------------
# Датчик температуры хоста
# ------------------------------------------------------------------------------
[temperature_sensor Хост]
sensor_type: temperature_host                                 # Датчик температуры хоста (CM4/Pi)
min_temp: 0                                                    # Минимальная температура
max_temp: 90                                                   # Максимальная температура

# ------------------------------------------------------------------------------
# Вентилятор крышки (управляемый по нагреву/движению)
# ------------------------------------------------------------------------------
[controller_fan Хост]
pin: PB11                                                      # Пин управления вентилятором крышки
max_power: 1.0                                                 # Макс. мощность (100%)
fan_speed: 1.0                                                 # Скорость при активности
idle_speed: 0.8                                                # Скорость на холостом ходу
idle_timeout: 120                                              # Задержка до снижения оборотов, с
kick_start_time: 0.5                                           # Время раскрутки, с
heater: extruder, heater_bed, chamber                         # Включается при нагреве этих зон
stepper: stepper_x, stepper_y, stepper_z, extruder            # Включается при движении моторов

# ------------------------------------------------------------------------------
# Обдув детали
# ------------------------------------------------------------------------------
[fan_generic extruder_fan]
pin: PA0                                                       # Пин обдува детали
enable_pin: !PF6                                               # Пин разрешения (инверсный)
cycle_time: 0.005                                              # Период ШИМ, с
off_below: 0.01                                                # Порог отключения (ниже — стоп)
kick_start_time: 0.2                                           # Время раскрутки, с
max_power: 0.9                                                 # Макс. мощность (90%)
shutdown_speed: 0                                              # Скорость при аварийном отключении
hardware_pwm: False                                            # Программный ШИМ

# ------------------------------------------------------------------------------
# Помпа охлаждения хотэнда
# ------------------------------------------------------------------------------
[heater_fan Помпа]
pin: PF5                                                       # Пин управления помпой
max_power: 1.0                                                 # Макс. мощность (100%)
heater: extruder, chamber                                     # Отслеживаемые нагреватели
heater_temp: 50.0                                             # Температура выключения, °C
kick_start_time: 0.8                                           # Время раскрутки, с

# ------------------------------------------------------------------------------
# Вентилятор холодной зоны
# ------------------------------------------------------------------------------
[heater_fan Холодная зона]
pin: multi_pin:1                                               # Пара пинов из [multi_pin 1]
max_power: 1.0                                                 # Макс. мощность (100%)
heater: chamber                                                # Отслеживаемый нагреватель
heater_temp: 50.0                                             # Температура выключения, °C
kick_start_time: 0.8                                           # Время раскрутки, с


# ==============================================================================
# РАЗДЕЛ: Филамент
# Назначение: Датчик наличия филамента (switch) и датчик движения (motion).
# Оба реагируют только во время активной печати — в паузе и простое молчат,
# чтобы не мешать смене филамента.
# ==============================================================================

# ------------------------------------------------------------------------------
# Датчик наличия филамента (switch sensor)
# ------------------------------------------------------------------------------
[filament_switch_sensor 0]
switch_pin: PC0                                                # Пин концевика наличия филамента
pause_on_runout: False                                         # Встроенную паузу не используем — своя ниже
runout_gcode:
    # --- Реагируем только во время печати ---
    {% if printer.print_stats.state == "printing" %}          # Если идёт активная печать
        PAUSE                                                  # Ставим печать на паузу
        RESPOND TYPE=error MSG="Филамент закончился"           # Выводим ошибку в консоль
    {% endif %}                                                # В паузе/простое ничего не делаем
insert_gcode:
    RESPOND MSG="Филамент появился"                            # Информируем о вставке филамента

# ------------------------------------------------------------------------------
# Датчик движения филамента (motion sensor)
# ------------------------------------------------------------------------------
[filament_motion_sensor 0m]
switch_pin: PF10                                               # Пин датчика движения филамента
pause_on_runout: False                                         # Встроенную паузу не используем — своя ниже
detection_length: 8                                            # Длина филамента для детекции, мм
extruder: extruder                                             # Привязка к экструдеру (следит за экструзией)
runout_gcode:
    # --- Реагируем только во время печати ---
    {% if printer.print_stats.state == "printing" %}          # Если идёт активная печать
        PAUSE                                                  # Ставим печать на паузу
        RESPOND TYPE=error MSG="Филамент не движется"          # Выводим ошибку в консоль
    {% endif %}                                                # В паузе/простое ничего не делаем