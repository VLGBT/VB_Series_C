# [include ../../macros/common.cfg]

[printer] #Конфигурация ограничений принтера 
kinematics: corexy #Кинематика
max_velocity: 300 #Максимальная скорость
max_accel: 5000 #Максимальное ускорение
max_z_velocity: 8 #Максимальня скорость оси Z
max_z_accel: 50 #Максимальное ускорение по оси Z
# [homing_override]
# gcode:
# 	G28 Z
# 	G28 Y
# 	G28 X
# axes: xy
[homing_override]
gcode:
  {% set have_x = 'X' in params %}
  {% set have_y = 'Y' in params %}
  {% set have_z = 'Z' in params %}
  {% set home_all = not (have_x or have_y or have_z) %}
  {% set homed = printer.toolhead.homed_axes %}

  # --- Полный хоминг, если нет параметров ---
  {% if home_all %}
    G28_BASE Z
    G28_BASE Y
    G28_BASE X
  {% endif %}

  # --- Z ---
  {% if have_z %}
    G28_BASE Z
  {% endif %}

  # --- Y ---
  {% if have_y %}
    {% if 'z' not in homed %}
      G28_BASE Z
    {% endif %}
    G28_BASE Y
  {% endif %}

  # --- X ---
  {% if have_x %}
    {% if 'y' not in homed %}
      {% if 'z' not in homed %}
        G28_BASE Z
      {% endif %}
      G28_BASE Y
    {% endif %}
    G28_BASE X
  {% endif %}




######################################################################
# Раздел моторов
######################################################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: !PF4
position_endstop: 0
position_max: 420
homing_speed: 40

[tmc2209 stepper_x]
uart_pin: PC13
#diag_pin: PF4 
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PF3
position_endstop: 0
position_max: 300
homing_speed: 40

[tmc2209 stepper_y]
uart_pin: PE3
#diag_pin: PF3
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 4
endstop_pin: PF2
position_endstop: 0.5
homing_speed: 15
second_homing_speed: 10
position_min: -10


[tmc2209 stepper_z]
uart_pin: PB9
#diag_pin: PF2
run_current: 0.650
stealthchop_threshold: 999999


[extruder]
nozzle_diameter: 0.4
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
microsteps: 16
rotation_distance: 4.774
filament_diameter: 1.75
heater_pin: PA3 # HE0
sensor_pin: PC5 # T0
sensor_type: PT1000
control: pid
pid_Kp: 100
pid_Ki: 100
pid_Kd: 100
min_temp: 0
max_temp: 550
pullup_resistor: 2200
min_extrude_temp:0
max_extrude_only_distance: 200
pressure_advance: 0 
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.800
stealthchop_threshold: 999999


[probe] ##Секция конфигурации датчика автокалибровки
pin: !PF1
x_offset: 0 #Расстояние от сопла до датчика автокалибровки
y_offset: 0
speed:10 #Скорость поднятия Z при автокалибровке
samples: 1 #Количество попыток калбировки на одной точке
sample_retract_dist: 0.5
lift_speed:30


[bed_mesh] #Сетка автокалибровки
speed: 50
horizontal_move_z: 10 # отступ во время проб по оси Z
algorithm: lagrange 
fade_start: 0.5 #на какой высоте начнем выравнивать модель
fade_end: 3 #на этой высоте в мм закончим выравнивать.

######################################################################
# Нагреватели
######################################################################



# ============================================================
# ОСНОВНОЙ НАГРЕВАТЕЛЬ СТОЛА (управляется первым термистором)
# ============================================================
[heater_generic heater_bed]
heater_pin: PF9                           # Пин управления нагревателем стола
sensor_type: ATC Semitec 104NT-4-R025H42G                     # Тип термистора
sensor_pin: PB0                           # Пин ПЕРВОГО термистора (управляющий)
control: pid                              # PID-регулирование
pid_Kp: 22.2                              # Параметры PID (подберите под свой стол)
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0                               # Минимальная температура
max_temp: 130                             # Максимальная температура для стола
max_power: 1.0

# ============================================================
# ПРОВЕРКА ОСНОВНОГО НАГРЕВАТЕЛЯ СТОЛА
# ============================================================
[verify_heater heater_bed]
max_error: 300
check_gain_time: 120                      # Для стола время прогрева меньше
hysteresis: 5
heating_gain: 2.0                         # Стол греется быстрее, чем камера

[heater_generic chamber] #Нагреватель термокамеры
heater_pin: PF7
sensor_type: temperature_combined
sensor_list:temperature_sensor _CH1, temperature_sensor _CH2
combination_method:mean
maximum_deviation:100
[temperature_sensor _CH1]
sensor_type:ATC Semitec 104NT-4-R025H42G
sensor_pin: PA7
min_temp:-100
max_temp:250
[temperature_sensor _CH2]
sensor_type:ATC Semitec 104NT-4-R025H42G
sensor_pin: PC4
min_temp:-100
max_temp:250
[verify_heater chamber] #Защита от перегрева термокамеры
max_error: 999
hysteresis: 30
heating_gain: 1
check_gain_time:120




######################################################################
# Вентиляторы и датчики температур
######################################################################

[multi_pin 1]
pins: PA4, PA5

[temperature_fan _chamber_fan]  #Вебкамера
pin: multi_pin:1
sensor_type: temperature_combined
sensor_list: temperature_sensor _CH1, temperature_sensor _CH2
combination_method: mean                       # Вентилятор работает ТОЛЬКО когда активен нагреватель
max_power: 1.0
target_temp: 40.0
kick_start_time: 0.5
min_temp: 0
max_temp: 45
maximum_deviation: 2
control: watermark

[output_pin Extruder_led]
pin: PA1            # Убедитесь, что с этим пином все в порядке
pwm: False                 # False для простого вкл/выкл. True, если нужна регулировка яркости
value: 1


[temperature_sensor Хост] #Температурный сенсор хоста
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[controller_fan Хост] #вентилятор крышки
pin: PB11                            # Ваш управляющий пин
max_power: 1.0   
fan_speed: 1.0                    # Скорость, например, 70%
idle_speed: 0.8
idle_timeout: 30
kick_start_time: 0.5                 # Время на раскрутку (сек)
#idle_timeout: 30                    # Время работы после остановки (сек)
# Список того, что будет включать вентилятор:
heater: extruder, heater_bed, chamber         # Включается при нагреве экструдера или стола
stepper: stepper_x, stepper_y, stepper_z, extruder # Включается при движении любого мотора
idle_timeout: 120

[fan_generic extruder_fan] #Вентилятор
pin: PA0
enable_pin: !PF6
cycle_time: 0.005
off_below: 0.01
kick_start_time: 0.2
max_power: 0.9
shutdown_speed: 0
hardware_pwm: False

[heater_fan Помпа]
pin: PF5                             # Пин управления вентилятором
max_power: 1.0                       # Скорость: 1.0 = 100%, можно 0.7 = 70%
heater: extruder                     # Какой нагреватель отслеживаем
heater_temp: 50.0                    # Температура выключения
kick_start_time: 0.8                 # Время на раскрутку (сек)



######################################################################
# Филамент
######################################################################

# ==============================================================================
# ДАТЧИК НАЛИЧИЯ ФИЛАМЕНТА (switch sensor)
# Назначение: Обнаруживает физическое отсутствие филамента в датчике (концевик
# разомкнулся). Реагирует только во время активной печати — в паузе и простое
# игнорирует срабатывание, чтобы не мешать смене филамента.
# ==============================================================================
[filament_switch_sensor 0]
switch_pin: PC0                          # Пин концевика наличия филамента
pause_on_runout: False                   # Не используем встроенную паузу — вызываем свою в runout_gcode
runout_gcode:
    # --- Проверка состояния: реагируем только во время печати ---
    {% if printer.print_stats.state == "printing" %}                           # Если идёт активная печать
        PAUSE                                                                  # Ставим печать на паузу
        RESPOND TYPE=error MSG="Филамент закончился"                           # Выводим ошибку в консоль
    {% endif %}                                                                # В паузе/простое ничего не делаем
insert_gcode:
    RESPOND MSG="Филамент появился"                                            # Просто информируем о вставке филамента


# ==============================================================================
# ДАТЧИК ДВИЖЕНИЯ ФИЛАМЕНТА (motion sensor)
# Назначение: Обнаруживает застревание/обрыв филамента по отсутствию движения
# при работающем экструдере. Реагирует только во время печати — в паузе и
# простое не срабатывает, т.к. филамент законно стоит на месте.
# ==============================================================================
[filament_motion_sensor 0m]
switch_pin: PF10                         # Пин датчика движения филамента
pause_on_runout: False                   # Не используем встроенную паузу — вызываем свою в runout_gcode
detection_length: 8                      # Длина филамента для детекции, мм
extruder: extruder                       # Привязка к экструдеру (отслеживает команды экструзии)
runout_gcode:
    # --- Проверка состояния: реагируем только во время печати ---
    {% if printer.print_stats.state == "printing" %}                           # Если идёт активная печать
        PAUSE                                                                  # Ставим печать на паузу
        RESPOND TYPE=error MSG="Филамент не движется"                          # Выводим ошибку в консоль
    {% endif %}                                                                # В паузе/простое ничего не делаем