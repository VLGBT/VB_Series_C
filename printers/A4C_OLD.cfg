[include common_old.cfg]

# ==============================================================================
# ФАЙЛ: переопределения под конкретный принтер
# Назначение: Дополняет основной конфиг калибровочными значениями осей
# (концевики, программные пределы хода) и границами промера сетки стола.
# Значения зависят от механики конкретной машины и настраиваются отдельно.
# ==============================================================================

# ------------------------------------------------------------------------------
# Пределы оси X
# ------------------------------------------------------------------------------
[stepper_x]
position_endstop: 275              # Позиция концевика X, мм
position_max: 275                  # Макс. ход по X, мм

# ------------------------------------------------------------------------------
# Пределы оси Y
# ------------------------------------------------------------------------------
[stepper_y]
position_endstop: 210              # Позиция концевика Y, мм
position_max: 276                  # Макс. ход по Y, мм

# ------------------------------------------------------------------------------
# Пределы оси Z
# ------------------------------------------------------------------------------
[stepper_z]
position_endstop: 215              # Позиция концевика Z, мм
position_max: 216                  # Макс. ход по Z (стол в самом низу), мм

# ------------------------------------------------------------------------------
# Границы промера сетки стола
# ------------------------------------------------------------------------------
[bed_mesh]
mesh_min: 25,35                    # Ближний угол области промера (X, Y), мм
mesh_max: 270,210                 # Дальний угол области промера (X, Y), мм
zero_reference_position: 150, 125  # Точка отсчёта Z (центр стола), мм
probe_count: 5, 4                  # Число точек сетки (X, Y)