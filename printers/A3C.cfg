[include common.cfg]

# ==============================================================================
# ФАЙЛ: переопределения под конкретный принтер
# Назначение: Дополняет основной конфиг калибровочными значениями осей
# (концевики, программные пределы хода) и границами промера сетки стола.
# Значения зависят от механики конкретной машины и настраиваются отдельно.
# ==============================================================================

# ------------------------------------------------------------------------------
# Пределы оси X
# ------------------------------------------------------------------------------
[stepper_x]
position_endstop: 430              # Позиция концевика X, мм
position_max: 430                  # Макс. ход по X, мм
position_min: -5                   # Мин. позиция X (запас за ноль), мм

# ------------------------------------------------------------------------------
# Пределы оси Y
# ------------------------------------------------------------------------------
[stepper_y]
position_endstop: 310              # Позиция концевика Y, мм
position_max: 310                  # Макс. ход по Y, мм
position_min: -8                   # Мин. позиция Y (запас за ноль), мм

# ------------------------------------------------------------------------------
# Пределы оси Z
# ------------------------------------------------------------------------------
[stepper_z]
position_endstop: 315              # Позиция концевика Z, мм
position_max: 315                  # Макс. ход по Z (стол в самом низу), мм

# ------------------------------------------------------------------------------
# Границы промера сетки стола
# ------------------------------------------------------------------------------
[bed_mesh]
mesh_min: 0,0                      # Ближний угол области промера (X, Y), мм
mesh_max: 420,300                  # Дальний угол области промера (X, Y), мм
zero_reference_position: 210, 150  # Точка отсчёта Z (центр стола), мм
probe_count: 5, 4                  # Число точек сетки (X, Y)

# ------------------------------------------------------------------------------
# Нагреватель стола (управляется первым термистором)
# ------------------------------------------------------------------------------
[heater_generic heater_bed1]
heater_pin: PF8                                               # Пин управления нагревателем стола
sensor_type: ATC Semitec 104NT-4-R025H42G                     # Тип термистора
sensor_pin: PB1                                                # Пин управляющего термистора стола
min_temp: 0                                                    # Минимальная температура
max_temp: 220                                                  # Максимальная температура стола
max_power: 1.0                                                 # Макс. мощность нагрева (100%)

[verify_heater heater_bed]
max_error: 300                                                 # Допустимая накопленная ошибка
check_gain_time: 120                                           # Окно контроля прироста температуры, с
hysteresis: 5                                                  # Гистерезис удержания, °C
heating_gain: 2.0                                              # Мин. прирост за окно, °C (стол греется быстро)
